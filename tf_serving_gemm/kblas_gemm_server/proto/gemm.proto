syntax = "proto3";
package gemm;

service GEMMService {
  rpc Compute    (ComputeRequest)    returns (ComputeResponse);
  rpc Sweep      (SweepRequest)      returns (SweepResponse);
  rpc ShapeSweep (ShapeSweepRequest) returns (ShapeSweepResponse);
}

message ComputeRequest {
  repeated float a_data = 1;
  repeated float b_data = 2;
  int32 M = 3;
  int32 K = 4;
  int32 N = 5;
}

message ComputeResponse {
  repeated float c_data          = 1;
  double         server_compute_ms = 2;
}

message SweepRequest {
  repeated int32 sizes  = 1;
  int32          iters  = 2;
  int32          warmup = 3;
}

message SweepResult {
  int32  M      = 1;
  int32  K      = 2;
  int32  N      = 3;
  double avg_ms = 4;
  double p50_ms = 5;
  double p99_ms = 6;
  double gflops = 7;
}

message SweepResponse {
  repeated SweepResult results = 1;
}

message GEMMShape {
  string model = 1;
  int32  batch = 2;
  int32  m     = 3;
  int32  k     = 4;
  int32  n     = 5;
  int32  count = 6;
}

message ShapeSweepRequest {
  repeated GEMMShape shapes = 1;
  int32              iters  = 2;
  int32              warmup = 3;
}

message ShapeResult {
  GEMMShape shape  = 1;
  double    avg_ms = 2;
  double    p50_ms = 3;
  double    p99_ms = 4;
  double    gflops = 5;
}

message ShapeSweepResponse {
  repeated ShapeResult results = 1;
}
